<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ART OF PLAY, a playable word (student concept)</title>
    <meta
      name="description"
      content="A student concept: a homepage hero where the letters of ART OF PLAY are thrown cards on a magic stage. Not affiliated with Art of Play."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <!-- The hero: the piece, full window. Nothing in it explains the method (rule 3). -->
      <section class="hero" id="hero">
        <canvas id="stage" aria-label="Nine letter-cards on a stage, to hold and throw with the mouse"></canvas>
        <div class="fade" id="fade" aria-hidden="true"></div>
        <p class="credit">Student concept, not affiliated with Art of Play.</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
